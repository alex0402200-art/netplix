<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2a1d">
<title>Artikel - KOTOKO</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9z"/><circle cx="8" cy="8" r="1.5"/></symbol>
</svg>

<div class="app">

  <header class="top">
    <div class="top-row">
      <a class="logo" href="index.html" aria-label="KOTOKO - Beranda">
        <img src="assets/logo-kotoko.png" alt="KOTOKO Audio Sound System">
      </a>
      <div class="top-icons">
        <button id="searchBtn" class="icon-btn" type="button" aria-label="Cari" aria-expanded="false" aria-controls="searchForm">
          <svg class="ic"><use href="#i-search"/></svg>
        </button>
        <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu kategori" aria-expanded="false" aria-controls="drawer">
          <svg class="ic"><use href="#i-menu"/></svg>
        </button>
      </div>
    </div>
    <!-- Pencarian dari halaman baca: kirim ke halaman utama -->
    <form id="searchForm" class="search-form" action="index.html" method="get" role="search" hidden>
      <input id="searchInput" name="q" type="search" placeholder="Cari artikel..." autocomplete="off" aria-label="Cari artikel">
    </form>
  </header>

  <main class="post-page">
    <a class="back" href="index.html"><svg class="ic"><use href="#i-back"/></svg><span>Kembali</span></a>

    <p id="pesan" class="msg" role="status">Memuat…</p>

    <article id="post" hidden>
      <img id="cover" class="post-cover" alt="" hidden>
      <div id="tag" class="tag" hidden></div>
      <h1 id="title" class="post-title"></h1>
      <div id="meta" class="post-meta"></div>
      <div id="body" class="post-body"></div>
      <a id="download" class="btn-link" target="_blank" rel="noopener noreferrer" hidden>
        <svg class="ic"><use href="#i-download"/></svg><span>Download</span>
      </a>
    </article>

    <section id="related" class="related" hidden>
      <h2 class="section-title">Artikel Lainnya</h2>
      <div id="relatedList" class="post-list"></div>
    </section>
  </main>

  <footer id="footer" class="site-footer"></footer>

</div>

<!-- Menu burger: daftar kategori -->
<div id="drawerBg" class="drawer-bg" hidden></div>
<aside id="drawer" class="drawer" aria-label="Menu">
  <div class="drawer-head">
    <span>Kategori</span>
    <button id="drawerClose" class="icon-btn" type="button" aria-label="Tutup menu">
      <svg class="ic"><use href="#i-close"/></svg>
    </button>
  </div>
  <nav id="drawerList" class="drawer-list"></nav>
</aside>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/post.js"></script>
</body>
</html>
